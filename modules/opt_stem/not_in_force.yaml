# Found by comparing eCFR versions 2026-09-14 and 2026-09-15 of 8 CFR 214.2(f)
# (https://www.ecfr.gov/api/versioner/v1/full/<date>/title-8.xml?part=214&section=214.2).
# Each quote is one changed sentence, copied from the chunk text.
- doc_id: ecfr-8-cfr-214-2
  reason: >-
    Added to the eCFR on 2026-09-15 by the final rule published 2026-07-17 (Federal Register
    doc 2026-14439). A federal court postponed that rule on 2026-09-14 (Presidents' Alliance
    v. DHS, D. Mass. 1:26-cv-13799), so the earlier text, including the 60-day periods, is in
    force.
  notice: >-
    A 2026 DHS rule would shorten some OPT deadlines from 60 days to 30, including the grace
    period after OPT and the latest date to apply after your program ends. A federal court
    postponed that rule on September 14, 2026, so the 60-day rules shown here still apply.
    Your DSO will know if this changes.
