# Policy manual guidance older than the regulation. 8 CFR 214.2(f)(5)(vi) has said cap-gap
# ends on April 1 since the eCFR version of 2025-01-17 (October 1 before). Sentences that
# state the old October 1 end date; other October 1 lines (the H-1B start date) still hold.
- doc_id: uscis-policy-manual-practical-training
  reason: >-
    States the cap-gap end date as October 1. Since 2025-01-17, 8 CFR 214.2(f)(5)(vi) extends
    status and employment authorization until April 1 of the fiscal year for which H-1B
    status is requested.
  notice: >-
    Some older USCIS guidance says cap-gap ends on October 1. The regulation was changed in
    January 2025 and now says April 1.
  quotes:
    - "The “cap-gap” period starts when an F-1 student’s status and employment authorization expires and, unless terminated, ends on October 1, the start date of the H-1B cap-subject petition filed on their behalf."  # 1-automatic-cap-gap-extension/1
    - "If USCIS approves the H-1B petition and the accompanying change of status request, the earliest date that the student may start the approved H-1B employment is October 1, but the beneficiary’s OPT employment authorization may expire before the H-1B start date."  # 1-automatic-cap-gap-extension/2, true but explains the old end date
    - "Once the listed requirements above are met, the automatic cap-gap extension begins and continues until October 1, or until the H-1B petition is rejected, denied, revoked, or withdrawn"  # 1-automatic-cap-gap-extension/3
