id: opt_stem
covered_topics:
  - OPT and post-completion work authorization
  - STEM OPT extension
  - Forms I-765, I-983 and I-20 as they relate to OPT
retrieval_threshold: -2.0
disclaimer: >-
  This is general information from official sources, not legal advice. Your school's DSO
  can confirm how it applies to you.
term_aliases:
  CPT: curricular practical training
  DHS: Department of Homeland Security
  DSO: designated school official
  EAD: Employment Authorization Document
  ICE: Immigration and Customs Enforcement
  OPT: optional practical training
  SEVIS: Student and Exchange Visitor Information System
  SEVP: Student and Exchange Visitor Program
  STEM: science, technology, engineering
  US: United States
  USCIS: U.S. Citizenship and Immigration Services
generic_terms: [OPT, STEM]
refusals:
  weak_retrieval: >-
    I couldn't find a reliable answer to this in the official OPT and STEM OPT sources.
    Your school's international office can say how it applies to you.
  prediction: >-
    I can't predict decisions or processing times. USCIS controls both, and its published
    case status and processing times are the only reliable source.
  case_specific: >-
    I can't say whether this applies to your situation. Your DSO can see your record and
    decide.
  legal_strategy: >-
    I can't advise on legal strategy or how to present your case. An immigration attorney
    can.
  out_of_scope: This tool covers F-1 OPT and STEM OPT only.
default_referrals:
  weak_retrieval: dso
  prediction: uscis
  case_specific: dso
  legal_strategy: attorney
  out_of_scope: dso
referrals:
  dso:
    label: Your school's DSO
    url: https://studyinthestates.dhs.gov/
  uscis:
    label: USCIS case processing times
    url: https://egov.uscis.gov/processing-times/
  attorney:
    label: AILA lawyer search
    url: https://www.ailalawyer.com/
  irs:
    label: IRS international taxpayers
    url: https://www.irs.gov/individuals/international-taxpayers
  j1_responsible_officer:
    label: Your program's J-1 Responsible Officer
classifier_examples:
  - question: How many hours a week do I have to work on post-completion OPT?
    label: answerable
  - question: Can I travel outside the US while my OPT application is pending?
    label: answerable
  - question: I changed my phone number, do I have to tell anyone?
    label: answerable
  - question: Does my employer need to enroll in E-Verify for a STEM OPT student?
    label: answerable
  - question: Is it allowed to hold two part-time jobs on OPT?
    label: answerable
  - question: Will USCIS approve my I-765 next month?
    label: prediction
  - question: I worked 40 days at a job that ended and then was out of work 70 days, am I over the limit?
    label: case_specific
  - question: What is the safest way to hide a gap in my employment from SEVIS?
    label: legal_strategy
  - question: Can I file an H-1B petition for myself without an employer?
    label: out_of_scope
